[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arya-test"
version = "0.1.0"
description = "Independent live client-contract checks for hermes-converse"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["arya_test*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --tb=short"
markers = ["live: uses the live Penny server", "speech: runs real STT, the selected model and TTS"]
